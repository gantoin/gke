# Profil "postgres" (module 6) : SPRING_PROFILES_ACTIVE=postgres
spring.autoconfigure.exclude=
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:boutique}
spring.datasource.username=${DB_USER:boutique}
spring.datasource.password=${DB_PASSWORD:}
# Si la base ne répond pas, on abandonne vite au lieu de bloquer les demandes
spring.datasource.hikari.connection-timeout=3000
# Au démarrage : crée la table si elle n'existe pas (schema.sql), puis ajoute les produits de départ (data.sql)
spring.sql.init.mode=always
# La base ne compte pas dans l'état de santé : si elle tombe, les pods de l'API restent en service
management.health.db.enabled=false
spring.sql.init.encoding=UTF-8
# Deux pods qui démarrent en même temps peuvent créer la table en même temps : on ne s'arrête pas pour ça
spring.sql.init.continue-on-error=true
