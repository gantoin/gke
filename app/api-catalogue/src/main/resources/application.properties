spring.application.name=api-catalogue
server.port=8080
server.shutdown=graceful

# Endpoints de santé utilisés par les probes Kubernetes :
# /actuator/health/liveness et /actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

# Par défaut, les produits sont gardés en mémoire : pas de base de données, donc pas de DataSource.
# Le profil "postgres" (module 6) réactive la DataSource : voir application-postgres.properties.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
