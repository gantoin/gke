# Leçon 12.3 : l'équipe demande 5 pods, le quota en autorise 3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: essai
  namespace: equipe-dev
spec:
  replicas: 5
  selector:
    matchLabels:
      app: essai
  template:
    metadata:
      labels:
        app: essai
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
