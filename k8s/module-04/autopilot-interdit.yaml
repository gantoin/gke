# Leçon 4.5 : un pod qu'Autopilot refuse (conteneur privilégié et accès au disque de la machine)
apiVersion: v1
kind: Pod
metadata:
  name: pod-interdit
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: disque-machine
          mountPath: /machine
  volumes:
    - name: disque-machine
      hostPath:
        path: /etc
