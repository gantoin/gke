# Leçon 4.2 : trois pods pour comprendre nodeSelector, taints et tolerations
# Le pool "pool-memoire" porte le taint reserve=memoire:NoSchedule
apiVersion: v1
kind: Pod
metadata:
  name: pod-libre            # aucune contrainte : il va où il y a de la place
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-elu              # il vise le pool, et il a le laissez-passer
spec:
  nodeSelector:
    cloud.google.com/gke-nodepool: pool-memoire
  tolerations:
    - key: reserve
      operator: Equal
      value: memoire
      effect: NoSchedule
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-refuse           # il vise le pool, mais sans laissez-passer
spec:
  nodeSelector:
    cloud.google.com/gke-nodepool: pool-memoire
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
