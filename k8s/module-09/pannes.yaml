# Leçon 9.5 : quatre pannes, introduites exprès. À vous de trouver la cause de chacune.
# Panne 1 : une image qui n'existe pas
apiVersion: v1
kind: Pod
metadata:
  name: panne-1
  namespace: boutique
  labels:
    lab: pannes
spec:
  containers:
    - name: api
      image: europe-west1-docker.pkg.dev/PROJECT_ID/formation-images/api-catalogue:v99
---
# Panne 2 : un programme qui s'arrête dès le démarrage
apiVersion: v1
kind: Pod
metadata:
  name: panne-2
  namespace: boutique
  labels:
    lab: pannes
spec:
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Démarrage du worker...'; echo 'ERREUR : la variable DB_HOST est absente'; exit 1"]
---
# Panne 3 : un programme qui prend plus de mémoire que sa limite
apiVersion: v1
kind: Pod
metadata:
  name: panne-3
  namespace: boutique
  labels:
    lab: pannes
spec:
  containers:
    - name: gourmand
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Chargement du catalogue en mémoire...'; tail /dev/zero"]
      resources:
        requests:
          cpu: 250m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 128Mi
---
# Panne 4 : un pod qui attend un disque qui n'existe pas
apiVersion: v1
kind: Pod
metadata:
  name: panne-4
  namespace: boutique
  labels:
    lab: pannes
spec:
  containers:
    - name: base
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: donnees
          mountPath: /donnees
  volumes:
    - name: donnees
      persistentVolumeClaim:
        claimName: disque-oublie
