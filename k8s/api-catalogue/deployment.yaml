# Déploiement complet de l'API catalogue (leçon 3.9)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-catalogue
  namespace: boutique
  labels:
    app: api-catalogue
    env: formation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-catalogue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-catalogue
        env: formation
    spec:
      containers:
        - name: api-catalogue
          image: europe-west1-docker.pkg.dev/PROJECT_ID/formation-images/api-catalogue:v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
