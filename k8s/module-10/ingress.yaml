# Leçon 10.5 : la porte d'entrée de la boutique, depuis Internet
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boutique
  namespace: boutique
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-catalogue
                port:
                  number: 80
