# Leçon 10.5 : l'Ingress de la boutique, protégé par Cloud Armor
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: boutique
  namespace: boutique
spec:
  securityPolicy:
    name: boutique                 # la politique Cloud Armor créée avec gcloud
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boutique
  namespace: boutique
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-catalogue
                port:
                  number: 80
