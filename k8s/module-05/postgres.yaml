# Leçon 5.5 : une base PostgreSQL de démonstration (sans stockage durable)
# Le mot de passe est en clair : on corrigera ça dans le module sur les secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: boutique
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              value: demo-a-changer
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: boutique
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
