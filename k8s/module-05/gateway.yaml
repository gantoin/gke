# Leçon 5.4 : le même routage, avec Gateway API
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: boutique
  namespace: boutique
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: boutique
  namespace: boutique
spec:
  parentRefs:
    - name: boutique
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-catalogue
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vitrine
          port: 80
---
# Le load balancer teste "/" par défaut. Notre API n'a rien à cette adresse :
# on lui indique l'adresse de santé de Spring Boot.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: api-catalogue
  namespace: boutique
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /actuator/health/readiness
  targetRef:
    group: ""
    kind: Service
    name: api-catalogue
