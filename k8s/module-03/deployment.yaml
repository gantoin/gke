# Leçon 3.4 : un Deployment simple, trois réplicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-catalogue
  labels:
    app: api-catalogue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-catalogue
  template:
    metadata:
      labels:
        app: api-catalogue
    spec:
      containers:
        - name: api-catalogue
          image: europe-west1-docker.pkg.dev/PROJECT_ID/formation-images/api-catalogue:v1
          ports:
            - containerPort: 8080
