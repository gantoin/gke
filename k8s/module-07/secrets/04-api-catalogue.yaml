# Leçon 7.3 : l'API lit le mot de passe de la base dans un fichier venu de Secret Manager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-catalogue
  namespace: boutique
  labels:
    app: api-catalogue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-catalogue
  template:
    metadata:
      labels:
        app: api-catalogue
    spec:
      serviceAccountName: api-catalogue        # l'identité du pod
      containers:
        - name: api-catalogue
          image: europe-west1-docker.pkg.dev/PROJECT_ID/formation-images/api-catalogue:v4
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-catalogue-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: DB_HOST
              value: postgres-0.postgres
            - name: DB_NAME
              value: boutique
            - name: DB_USER
              value: boutique
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/
            - name: SPRING_CONFIG_IMPORT        # chaque fichier de /var/secrets devient un réglage
              value: configtree:/var/secrets/
          volumeMounts:
            - name: config
              mountPath: /config
            - name: secrets
              mountPath: /var/secrets
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: api-catalogue-config
            items:
              - key: application.properties
                path: application.properties
        - name: secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: boutique-secrets
