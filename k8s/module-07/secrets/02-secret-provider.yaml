# Leçon 7.3 : quel secret de Secret Manager poser dans les pods, et sous quel nom de fichier
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: boutique-secrets
  namespace: boutique
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/boutique-db-mot-de-passe/versions/latest"
        path: "DB_PASSWORD"
