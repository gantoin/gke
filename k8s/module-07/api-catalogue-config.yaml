# Leçon 7.1 : l'API catalogue (image v4) lit sa configuration dans le ConfigMap
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-catalogue
  namespace: boutique
  labels:
    app: api-catalogue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-catalogue
  template:
    metadata:
      labels:
        app: api-catalogue
    spec:
      containers:
        - name: api-catalogue
          image: europe-west1-docker.pkg.dev/PROJECT_ID/formation-images/api-catalogue:v4
          ports:
            - containerPort: 8080
          envFrom:                            # façon 1 : chaque valeur simple devient une variable
            - configMapRef:
                name: api-catalogue-config
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION   # Spring lit aussi les fichiers de /config
              value: file:/config/
          volumeMounts:                       # façon 2 : le fichier du ConfigMap, dans /config
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: api-catalogue-config
            items:
              - key: application.properties
                path: application.properties
