# Leçon 7.5 : la base commune à tous les environnements
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-catalogue
  labels:
    app: api-catalogue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-catalogue
  template:
    metadata:
      labels:
        app: api-catalogue
    spec:
      containers:
        - name: api-catalogue
          image: europe-west1-docker.pkg.dev/PROJECT_ID/formation-images/api-catalogue:v4
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-catalogue-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
