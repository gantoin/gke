# Leçon 7.5 : ce qui change pour l'environnement « dev »
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-dev
resources:
  - namespace.yaml
  - ../../base
replicas:
  - name: api-catalogue
    count: 1
configMapGenerator:               # Kustomize crée le ConfigMap, avec un nom qui change quand son contenu change
  - name: api-catalogue-config
    literals:
      - BOUTIQUE_MESSAGE=Boutique de test
