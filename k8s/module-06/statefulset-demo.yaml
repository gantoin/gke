# Leçon 6.2 : un StatefulSet de démonstration, avec trois pods et un disque chacun
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: boutique
spec:
  clusterIP: None                 # service "headless" : un nom DNS par pod
  selector:
    app: demo
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo
  namespace: boutique
spec:
  serviceName: demo               # le service headless ci-dessus
  replicas: 3
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: demo
          image: busybox:1.36
          command: ["sh", "-c", "echo \"Je suis $(hostname)\" >> /data/journal.txt; sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:           # le moule : un disque par pod
    - metadata:
        name: data
      spec:
        storageClassName: standard-rwo
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
