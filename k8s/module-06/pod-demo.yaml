# Leçon 6.1 : un pod qui utilise la demande de stockage "demo-donnees"
apiVersion: v1
kind: Pod
metadata:
  name: demo-stockage
  namespace: boutique
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: demo
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: donnees
          mountPath: /data        # le disque apparaît dans ce dossier
  volumes:
    - name: donnees
      persistentVolumeClaim:
        claimName: demo-donnees
