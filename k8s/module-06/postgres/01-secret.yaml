# Leçon 6.3 : l'utilisateur et le mot de passe de la base
# Un mot de passe dans un fichier du dépôt, ce n'est pas une bonne pratique :
# on corrigera ça dans le module sur les secrets. Changez au moins la valeur.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: boutique
type: Opaque
stringData:
  utilisateur: boutique
  mot-de-passe: demo-a-changer
