# Leçon 6.3 : PostgreSQL dans un StatefulSet, avec un disque SSD
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: boutique
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: boutique
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: utilisateur
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: mot-de-passe
            - name: PGDATA                       # les données dans un sous-dossier du disque
              value: /var/lib/postgresql/data/pgdata
          resources:                             # requests = limits : classe Guaranteed
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:                        # la base accepte-t-elle les connexions ?
            exec:
              command: ["pg_isready", "-U", "boutique", "-d", "boutique"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: premium-rwo
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
