# Leçon 8.2 : de faux visiteurs, pour charger l'API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: charge
  namespace: boutique
spec:
  replicas: 4
  selector:
    matchLabels:
      app: charge
  template:
    metadata:
      labels:
        app: charge
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: charge
          image: busybox:1.36
          # 8 boucles par pod : chacune demande la liste des produits, sans s'arrêter
          command:
            - sh
            - -c
            - |
              for i in 1 2 3 4 5 6 7 8; do
                (while true; do wget -q -T 2 -O /dev/null http://api-catalogue/api/produits; done) &
              done
              wait
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 64Mi
