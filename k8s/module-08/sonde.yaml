# Leçons 8.5 et 8.6 : un visiteur témoin, qui compte les demandes réussies et les erreurs
apiVersion: v1
kind: Pod
metadata:
  name: sonde
  namespace: boutique
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: sonde
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          ok=0; ko=0
          while true; do
            if wget -q -T 2 -O /dev/null http://api-catalogue/api/produits; then ok=$((ok+1)); else ko=$((ko+1)); fi
            [ $(( (ok+ko) % 100 )) -eq 0 ] && echo "demandes : $((ok+ko))   réussies : $ok   en erreur : $ko"
            sleep 0.1
          done
