# Leçon 8.4 : des pods qui demandent beaucoup de place, pour obliger le cluster à ajouter des machines
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gros-pods
  namespace: boutique
spec:
  replicas: 4
  selector:
    matchLabels:
      app: gros-pods
  template:
    metadata:
      labels:
        app: gros-pods
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: attente
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
