# L'environnement « prod » : pour le modifier, on modifie ce fichier dans Git. Rien d'autre.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-prod
resources:
  - ../../base
replicas:
  - name: api-catalogue
    count: 2
patches:
  - target:
      kind: Deployment
      name: api-catalogue
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: api-catalogue:v5      # la version déployée en prod
configMapGenerator:
  - name: api-catalogue-config
    literals:
      - BOUTIQUE_MESSAGE=Bienvenue dans la boutique
