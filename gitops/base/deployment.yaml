# Leçons 11.5 et 11.6 : ce que Git décrit, Argo CD le déploie
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-catalogue
  labels:
    app: api-catalogue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-catalogue
  template:
    metadata:
      labels:
        app: api-catalogue
    spec:
      containers:
        - name: api-catalogue
          image: api-catalogue          # le dépôt d'images est indiqué dans l'Application Argo CD
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-catalogue-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
